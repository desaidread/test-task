version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: test_task
    environment:
       POSTGRES_DB: taskdb
       POSTGRES_USER: taskuser
       POSTGRES_PASSWORD: taskpass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./sql/init.sql:/docker-entry  point-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  
  app:
    build: .
    container_name: subscriptions_app
    ports:
      - "8080:8080"
    environment:
      SQL_CONN: postgres://taskuser:taskpass@postgres:5432/taskdb?sslmode=disable
      APP_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: 

